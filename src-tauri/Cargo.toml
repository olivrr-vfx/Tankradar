[package]
name = "tankradar"
version = "1.0.0"
description = "Tankradar – Spritpreise, Preisverlauf & Routenplaner"
authors = ["Tankradar contributors"]
license = "MIT"
repository = "https://github.com/olivrr-vfx/tankradar"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tankradar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
